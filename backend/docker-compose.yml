services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: casemap
      POSTGRES_USER: casemap
      POSTGRES_PASSWORD: casemap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - ollama
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
  ollama:

